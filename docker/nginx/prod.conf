# ALTLAGA-10: TLS variant of prod.conf. Keep in sync with prod.conf.
# Static config; certificate paths are the fixed /certs mount targets.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    # TLS server
    ssl_certificate /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:alma_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # verify the upstream certificates (backend, keycloak, mapserver) against the
    # alma CA; a wrong certificate results in 502
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /certs/ca.crt;
    proxy_ssl_verify_depth 3;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse on;
    server_name localhost;

    root /var/www/alma-frontend/;
    proxy_read_timeout 120;
    client_max_body_size 40M;
    set_real_ip_from 10.1.0.1;
    set_real_ip_from 10.1.0.5;
    set_real_ip_from 10.1.0.7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;


    location ~ ^(/api/.*|/graphql|/openapi\.json)$ {
        proxy_pass https://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    location /mapserver {
        # proxy
        proxy_pass https://mapserver:8081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        # Allow access from whitelisted IP *or* using HTTP auth;
        satisfy any;

        include /etc/nginx/allow_ips.conf;

        deny all;

        include /etc/nginx/kbs_mapserver.conf;
    }

    location /auth/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # TODO: enable this for internal IP addresses:
        # uncomment the following line if you want to use the keycloak admin UI:
        proxy_pass https://keycloak:8443/auth/;

        location /auth/realms/alma/ {
            proxy_pass https://keycloak:8443/auth/realms/alma/;
        }

        location /auth/resources/ {
            proxy_pass https://keycloak:8443/auth/resources/;
        }

        location /auth/js/ {
            proxy_pass https://keycloak:8443/auth/js/;
        }

        location /auth/robots.txt {
            proxy_pass https://keycloak:8443/auth/robots.txt;
        }
    }

    include /srv/alma/next-routes.conf;

    location / {
        try_files $uri $uri/ @rewrites;
    }

    # match for filename in capture group 1
    location ~ ^/interlis_exports/(?<target>[a-zA-Z0-9-_\.%\/]+)$ {
        root /var/www/interlis_exports;
        autoindex off;

        if ($request_uri ~ \.\.) {
            # prevent directory traversal
            return 403;
        }
        try_files /$target =404; # do send an actual 404 if not found

        include /etc/nginx/interlis_exports.conf;
    }

    # directory root of the report exports (try_files below cannot match directories)
    location = /kbs/ {
        alias /var/www/report_exports/;

        include /etc/nginx/report_exports.conf;
    }

    # match for filename in capture group 1
    location ~ ^/kbs/(?<target>[a-zA-Z0-9-_\.%\/]+)$ {
        root /var/www/report_exports;

        if ($request_uri ~ \.\.) {
            # prevent directory traversal
            return 403;
        }
        try_files /$target =404; # do send an actual 404 if not found

        include /etc/nginx/report_exports.conf;
    }

    location @rewrites {
        rewrite ^(.+)$ /404.html last;
    }

}
