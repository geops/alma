services:
  db:
    image: registry.geops.com/geops/alma/alma-db:${TAG:-latest}
    build:
      target: final-tls
      context: .
      dockerfile: ./docker/db/Dockerfile
    command: -c shared_preload_libraries='anon' -c log_connections=on

  mapserver:
    image: registry.geops.com/geops/alma/alma-mapserver:${TAG:-latest}
    build:
      target: final-tls

  keycloak:
    environment:
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8080"

  nginx:
    image: registry.geops.com/geops/alma/alma-nginx:${TAG:-latest}
    build:
      target: final-tls
      context: .
      dockerfile: ./docker/nginx/prod.Dockerfile
